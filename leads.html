<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Add Lead | Fundvexxa CRM</title><link rel="stylesheet" href="assets/css/style.css"><link rel="stylesheet" href="assets/fundvexxa-premium.css">
<meta name="theme-color" content="#102b50">
<link rel="icon" href="assets/fundvexxa-icon.svg" type="image/svg+xml">
<link rel="manifest" href="manifest.webmanifest">
</head><body><div class="container" style="max-width:760px;padding:50px 0"><div class="card"><span class="eyebrow">Fundvexxa CRM</span><h1 style="color:var(--navy)">Add Customer Lead</h1><p style="color:var(--muted)">New leads are saved in Firestore and become available in the CRM for calls, remarks and follow-ups.</p><form id="leadForm"><div class="row"><div class="field"><label>Customer Name *</label><input id="customerName" required></div><div class="field"><label>Mobile *</label><input id="mobile" required type="tel"></div></div><div class="row"><div class="field"><label>Email</label><input id="email" type="email"></div><div class="field"><label>Company</label><input id="company"></div></div><div class="row"><div class="field"><label>Service *</label><select id="service" required><option value="">Select</option><option>Business Loan</option><option>MSME Loan</option><option>Working Capital / CC / OD</option><option>Mudra Loan</option><option>PMEGP Funding</option><option>Startup Funding</option><option>Corporate Funding</option><option>Personal Loan</option><option>Used Car Loan</option><option>Agri / NGO / Grant Funding</option><option>Credit Card</option><option>Website / Marketing / App</option></select></div><div class="field"><label>Required Amount</label><input id="amount" type="number"></div></div><div class="field"><label>Initial Remarks</label><textarea id="remarks" placeholder="Customer requirement, business vintage, documents, etc."></textarea></div><button class="btn btn-primary" style="width:100%">Save Lead to CRM →</button><p id="msg" class="notice"></p></form><a class="more" href="admin-crm.html">Open Customer CRM →</a></div></div><script type="module">import {auth,db} from './firebase/config.js';import{collection,addDoc,serverTimestamp}from'https://www.gstatic.com/firebasejs/12.0.0/firebase-firestore.js';import{onAuthStateChanged}from'https://www.gstatic.com/firebasejs/12.0.0/firebase-auth.js';let user=null;onAuthStateChanged(auth,u=>{user=u;if(!u)location.href='login.html'});document.getElementById('leadForm').addEventListener('submit',async e=>{e.preventDefault();if(!user)return;let d={name:customerName.value.trim(),customerName:customerName.value.trim(),phone:mobile.value.trim(),mobile:mobile.value.trim(),email:email.value.trim(),company:company.value.trim(),requirement:service.value,service:service.value,amount:amount.value?Number(amount.value):null,remarks:remarks.value.trim(),status:'New',callStatus:'Not Called',source:'manual-crm',agentId:user.uid,agentEmail:user.email||'',createdAt:serverTimestamp()};try{await addDoc(collection(db,'leads'),d);msg.textContent='Lead saved successfully ✓';e.target.reset()}catch(err){msg.textContent=err.message}})</script><script>if("serviceWorker" in navigator){window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));}</script>
</body></html>
